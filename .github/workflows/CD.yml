name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Workflow"]
    types:
      - completed


jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy Manifests and Deploy via SSH
        run: |
          # Create ssh directory if does not exist
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

          # Copy manifests folder to the prod server
          scp -r ansible/manifests ubuntu@${{ secrets.PROD_HOST }}:/home/ubuntu/

          # SSH into prod server and execute the deployment and rollout
          ssh ubuntu@${{ secrets.PROD_HOST }} << 'EOF'
            kubectl apply -f /home/ubuntu/manifests/deployment.yaml
            kubectl apply -f /home/ubuntu/manifests/service.yaml
            kubectl rollout restart deployment/flask-app-deployment
            kubectl rollout status deployment/flask-app-deployment
          EOF
