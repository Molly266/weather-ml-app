name: CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Smoke Test
        run: python -m unittest tests/smoke_test.py

      - name: Run Unit Test
        run: python -m unittest tests/unit_test.py

      - name: Run Integration Test
        run: python -m unittest tests/integration_test.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: weather-ml:build

      - name: Test Container Launch
        run: |
          docker run -d --name test-container -p 5000:5000 weather-ml:build
          docker ps
          docker exec test-container python -c "import app; print('Container started successfully!')"
          docker stop test-container
          docker rm test-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_KEY }}

      - name: Tag and Push Docker Image to DockerHub
        run: |
          docker tag weather-ml:build molly266/weather-ml:latest
          docker push molly266/weather-ml:latest
